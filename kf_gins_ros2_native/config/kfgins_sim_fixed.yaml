kf_gins_node:
  ros__parameters:
    # ===== 【修复】新增的仿真/实机模式参数 =====
    use_sim_gnss_std: true          # 启用仿真模式 GNSS std
    sim_gnss_std_h_m: 0.08          # 仿真环境下的水平 GNSS 标准差（米）
    sim_gnss_std_u_m: 0.10          # 仿真环境下的竖直 GNSS 标准差（米）
    use_zero_velocity_update_when_disarmed: true  # 无人机未启动时应用零速度约束
    zupt_reset_interval_sec: 1.0    # 地面 ZUPT 复位间隔（秒）
    zupt_std_mps: 0.05              # 预留：未来可接入真 ZUPT 观测
    disarmed_yaw_lock_enable: true
    disarmed_yaw_lock_interval_sec: 1.0
    disarmed_yaw_lock_max_yaw_err_deg: 5.0
    force_zero_antlever: true
    enable_gnss_velocity_update: true   # active mission 的首发偏差先出现在 Z 轴 climb 段，先补 GNSS velocity 约束
    gnss_vel_std_floor_h_mps: 0.10
    gnss_vel_std_floor_u_mps: 0.15
    native_gnss_speed_std_scale: 0.4
    armed_cruise_native_gnss_vel_override_enable: true
    armed_cruise_gnss_pos_override_enable: true
    armed_cruise_gnss_pos_std_h_m: 0.06
    armed_cruise_gnss_pos_std_u_m: 0.08
    armed_cruise_native_gnss_vel_min_horizontal_speed_mps: 0.5
    armed_cruise_native_gnss_vel_std_h_mps: 0.05
    armed_cruise_native_gnss_vel_std_u_mps: 0.10
    armed_cruise_native_gnss_vel_residual_boost_enable: true
    armed_cruise_native_gnss_vel_residual_boost_threshold_mps: 0.10
    armed_cruise_native_gnss_vel_residual_boost_hold_sec: 8.0
    armed_cruise_native_gnss_vel_residual_boost_std_h_mps: 0.03
    armed_cruise_native_gnss_vel_residual_boost_std_u_mps: 0.08
    armed_cruise_vertical_cov_reopen_enable: true
    armed_cruise_vertical_cov_reopen_threshold_m: 0.15
    armed_cruise_vertical_cov_reopen_hold_sec: 8.0
    armed_cruise_vertical_cov_reopen_pos_std_m: 0.15
    armed_cruise_vertical_cov_reopen_vel_std_mps: 0.10
    armed_cruise_vertical_cov_reopen_accbias_std_z_mps2: 0.05
    post_flight_vertical_cov_reopen_enable: true
    post_flight_vertical_cov_reopen_threshold_m: 0.12
    post_flight_vertical_cov_reopen_hold_sec: 20.0
    post_flight_vertical_cov_reopen_grace_sec: 30.0
    post_flight_vertical_cov_reopen_pos_std_m: 0.25
    post_flight_vertical_cov_reopen_vel_std_mps: 0.10
    post_flight_vertical_cov_reopen_accbias_std_z_mps2: 0.05
    use_online_reset_covariance: true
    reset_pos_std_m: 5.0
    reset_vel_std_mps: 5.0
    reset_roll_pitch_std_deg: 5.0
    reset_yaw_std_deg: 10.0
    enable_heading_update: true
    heading_update_std_deg: 5.0
    heading_update_max_rate_hz: 10.0
    heading_update_max_age_sec: 0.5
    heading_update_innovation_gate_deg: 15.0
    heading_update_armed_innovation_gate_deg: 8.0
    heading_update_turn_innovation_gate_deg: 12.0
    heading_update_max_source_yaw_rate_deg_s: 15.0
    heading_update_source_jump_gate_deg: 20.0
    heading_update_source_jump_block_sec: 2.0
    heading_update_hard_innovation_gate_deg: 15.0
    heading_post_turn_reacquire_enable: true
    heading_post_turn_reacquire_window_sec: 2.0
    heading_post_turn_reacquire_max_residual_deg: 45.0
    heading_post_turn_reacquire_std_deg: 1.5
    heading_post_turn_cruise_track_std_deg: 1.0
    heading_post_turn_reacquire_hold_sec: 4.0
    heading_post_turn_reacquire_max_rate_hz: 5.0
    heading_post_turn_force_relock_enable: true
    heading_post_turn_force_relock_min_residual_deg: 1.1
    heading_post_turn_force_relock_min_consecutive_blocks: 3
    heading_post_turn_force_relock_yaw_std_deg: 1.5
    heading_post_turn_force_relock_max_rate_hz: 1.0
    heading_post_turn_hold_force_relock_enable: true
    heading_post_turn_hold_force_relock_min_residual_deg: 4.0
    heading_post_turn_hold_force_relock_min_consecutive_blocks: 4
    heading_armed_cruise_force_relock_enable: true
    heading_armed_cruise_force_relock_min_residual_deg: 1.8
    heading_armed_cruise_force_relock_min_consecutive_blocks: 6
    heading_armed_cruise_force_relock_min_horizontal_speed_mps: 4.0
    heading_armed_cruise_force_relock_max_vertical_speed_mps: 1.0
    heading_armed_cruise_force_relock_max_gyro_deg_s: 2.0
    heading_armed_cruise_force_relock_max_source_yaw_rate_deg_s: 2.0
    heading_armed_cruise_force_relock_yaw_std_deg: 1.5
    heading_armed_cruise_force_relock_max_rate_hz: 1.0
    heading_underreaction_force_relock_enable: true
    heading_underreaction_force_relock_min_residual_deg: 1.1
    heading_post_turn_soft_underreaction_min_residual_deg: 1.2
    heading_underreaction_force_relock_min_remaining_ratio: 0.85
    heading_underreaction_force_relock_yaw_std_deg: 1.5
    heading_underreaction_force_relock_max_rate_hz: 4.0
    heading_underreaction_force_relock_max_gyro_deg_s: 8.0
    heading_underreaction_force_relock_max_source_yaw_rate_deg_s: 8.0
    tilt_force_relock_enable: true
    tilt_force_relock_min_residual_deg: 2.0
    tilt_force_relock_roll_pitch_std_deg: 1.5
    tilt_force_relock_once_per_motion_context: true
    tilt_force_relock_max_rate_hz: 2.0
    tilt_force_relock_max_gyro_deg_s: 8.0
    tilt_force_relock_max_vertical_speed_mps: 1.5
    heading_recovery_enable: true
    heading_recovery_min_residual_deg: 15.0
    heading_recovery_max_residual_deg: 80.0
    heading_recovery_max_step_deg: 3.0
    heading_recovery_std_deg: 10.0
    heading_recovery_max_rate_hz: 2.0
    heading_recovery_max_gyro_deg_s: 2.0
    heading_recovery_max_source_yaw_rate_deg_s: 2.0
    heading_recovery_max_horizontal_speed_mps: 5.5
    heading_recovery_max_vertical_speed_mps: 2.0
    heading_recovery_min_consecutive_skips: 2
    heading_update_low_speed_thresh_mps: 2.0
    heading_update_armed_min_horizontal_speed_mps: 0.0
    heading_update_max_vertical_speed_mps: 3.0
    preserved_core_yaw_max_mavros_diff_deg: 5.0
    preserved_core_yaw_max_core_gnss_diff_m: 5.0
    heading_update_when_armed: true
    heading_update_armed_max_speed_thresh_mps: 6.5
    heading_update_when_disarmed: true
    heading_update_when_armed_low_speed: true
    heading_update_when_gnss_no_fix: true
    skip_medium_imu_gap_when_turning: false
    imu_gap_turn_rate_gate_deg_s: 10.0
    imu_gap_vertical_speed_gate_mps: 1.0
    imu_gap_accel_deviation_gate_mps2: 2.0
    imu_gap_maneuver_cooldown_sec: 1.0
    skip_large_imu_gap_samples: true
    severe_imu_gap_reset_sec: 0.16
    delta_imu_source_gap_bridge_enable: true
    delta_imu_source_gap_bridge_min_sec: 0.05
    delta_imu_source_gap_bridge_min_ratio: 5.0
    delta_imu_source_gap_bridge_max_sec: 0.30
    delta_imu_source_gap_reset_sec: 1.0
    sensor_combined_source_gap_diag_enable: true
    sensor_combined_source_gap_diag_min_sec: 0.05
    sensor_combined_source_gap_diag_min_ratio: 5.0
    sensor_combined_source_gap_reset_sec: 0.50
    
    # ===== 原有参数（保持兼容） =====
    use_sim_time: true
    imu_source: mavros_raw
    imu_topic: /mavros/imu/data_raw
    px4_sensor_combined_topic: /fmu/out/sensor_combined
    px4_vehicle_imu_topic: /fmu/out/vehicle_imu
    gnss_topic: /gps/fix
    imu_is_delta: false
    imu_input_is_flu: true
    use_source_dt_for_px4_imu: true
    imu_gap_warn_ms: 60.0

    map_frame: map
    odom_frame: map
    base_frame: base_link

    # 轨迹与发布节流
    path_publish_rate_hz: 5.0
    pose_decimation: 5
    max_path_points: 20000
    min_dist_m: 1.0

    # 对齐/跳变门限
    use_gnss_llh_for_pose: false
    use_gnss_llh_for_pose_when_disarmed: false
    start_after_gnss_sec: 1.0
    publish_after_sec: 1.0
    align_gate_m: 5.0
    max_jump_m: 30.0
    reset_gate_m: 8.0
    v_limit_mps: 20.0
    publish_max_core_gnss_diff_m: 5.0
    fallback_to_gnss_pose_on_large_core_diff: true

    # GNSS 默认标准差（用于实机模式）
    gnss_default_std_h_m: 5.0
    gnss_default_std_u_m: 10.0
    gnss_min_std_m: 0.5

    # 时间处理
    use_node_time_for_core: false
    use_integrated_time_for_core: true
    use_steady_time_for_imu_dt: true
    force_monotonic_time_for_core: true
    min_imu_dt_sec: 0.001
    max_imu_dt_sec: 0.05
    imu_dt_estimate_sec: 0.01
    auto_reset_on_time_jump: true
    time_jump_reset_threshold_sec: 0.5
    gnss_time_offset_sec: 0.001

    # MAVROS 状态监控
    mavros_state_topic: /mavros/state
    path_require_armed: false
    clear_path_on_arm_transition: false

    # 故障恢复
    auto_reset_on_invalid_state: true
    invalid_state_reset_cooldown_sec: 5.0
